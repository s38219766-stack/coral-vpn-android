name: Android
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      UPLOAD_TOKEN: ${{ secrets.APP_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Xray-core (MPL-2.0)
        run: |
          curl -fL -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v24.12.31/Xray-android-arm64-v8a.zip
          unzip -o xray.zip -d xray && ls -la xray
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp xray/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          cp xray/geoip.dat xray/geosite.dat app/src/main/assets/
      - name: sing-box (GPL-3.0, отдельный процесс) для Hysteria2 и Shadow-TLS
        run: |
          curl -fL -o sb.tgz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-android-arm64.tar.gz
          tar xzf sb.tgz
          cp sing-box-1.14.4-android-arm64/sing-box app/src/main/jniLibs/arm64-v8a/libsingbox.so
          ls -la app/src/main/jniLibs/arm64-v8a/
      - uses: actions/setup-go@v5
        with:
          go-version-file: ct/go.mod
      - name: Coral Transport (наш слой формы трафика, отдельный процесс)
        working-directory: ct
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libct.so .
          ls -la ../app/src/main/jniLibs/arm64-v8a/
      - name: hev-socks5-tunnel (MIT)
        run: |
          mkdir -p hevbuild/jni && cd hevbuild
          git clone --depth 1 --recursive --shallow-submodules https://github.com/heiher/hev-socks5-tunnel jni/hev-socks5-tunnel
          echo 'include $(call all-subdir-makefiles)' > jni/Android.mk
          "$ANDROID_NDK_LATEST_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-26 "APP_CFLAGS=-O3 -DPKGNAME=com/coral/vpn" "APP_LDFLAGS=-Wl,--build-id=none"
          cp libs/arm64-v8a/libhev-socks5-tunnel.so ../app/src/main/jniLibs/arm64-v8a/
      - name: Тесты
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Ключ подписи
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coral.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/coral.p12" >> "$GITHUB_ENV"
      - name: Сборка (release, подписана своим ключом)
        if: env.KEYSTORE_B64 != ''
        run: gradle :app:assembleRelease -Pvc=${{ github.run_number }} --no-daemon
      - name: Сборка (debug, ключа нет)
        if: env.KEYSTORE_B64 == ''
        run: gradle :app:assembleDebug -Pvc=${{ github.run_number }} --no-daemon
      - name: Публикация на сервер (само появится в приложении)
        if: env.UPLOAD_TOKEN != '' && github.ref_name == github.event.repository.default_branch
        run: |
          APK=$(ls app/build/outputs/apk/*/*.apk | head -1)
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          curl -fsS --max-time 600 -X POST -H "X-Upload-Token: $UPLOAD_TOKEN" --data-binary @"$APK" \
            "https://coralsvobod.duckdns.org/api/app/upload?version=$VER&vc=${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: coral-vpn-debug-apk
          path: app/build/outputs/apk/*/*.apk
